# Render Blueprint — Tiverto
# Not: Render'ın geçici disk'i KALICI veri için kullanılmaz.
# Kalıcı veriler yönetilen PostgreSQL'de tutulur (aşağıdaki veritabanı).
services:
  - type: web
    name: tiverto
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    # Migration'lar her başlatmada çalışır (idempotent); build aşamasında
    # veritabanına erişim olmayabilir, bu yüzden start'a bağlandı.
    startCommand: npm run db:migrate:deploy && npm run db:rls && npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tiverto-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: tiverto-db
          property: connectionString
      - key: NEXT_PUBLIC_ROOT_DOMAIN
        sync: false
      - key: DEMO_MODE
        value: "false"
      # Demo girişi ve örnek veri canlı ortamda kapalıdır.

databases:
  - name: tiverto-db
    plan: free
    region: frankfurt
    databaseName: tiverto
    user: tiverto
