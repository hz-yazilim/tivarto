# Render Blueprint — Tiverto
# Gelistirme önizlemesi: DB olmadan bellek içi sahte veriyle açılır.
# Kalıcı veritabanı bağlandığında aşağıdaki iki demo değişkenini false yapın.
services:
  - type: web
    name: tiverto
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    # start.mjs demo modunda migration/RLS adımlarını atlar.
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tiverto-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: tiverto-db
          property: connectionString
      - key: NEXT_PUBLIC_ROOT_DOMAIN
        sync: false
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_FAKE_DATA
        value: "true"

databases:
  - name: tiverto-db
    plan: free
    region: frankfurt
    databaseName: tiverto
    user: tiverto
