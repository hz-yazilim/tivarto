# Render Blueprint — Tivarto
# Bu servis şu an yalnızca DB'siz geliştirme/demo önizlemesidir.
# Gerçek veritabanına geçerken TIVARTO_REAL_MODE=true ve DATABASE_URL ekleyin.
services:
  - type: web
    name: tiverto
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TIVARTO_REAL_MODE
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_FAKE_DATA
        value: "true"
      - key: NEXT_PUBLIC_ROOT_DOMAIN
        sync: false
