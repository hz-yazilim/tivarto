name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Prisma Client üret
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://x:x@localhost:5432/x
          DIRECT_URL: postgresql://x:x@localhost:5432/x

      - name: Şema doğrula
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://x:x@localhost:5432/x
          DIRECT_URL: postgresql://x:x@localhost:5432/x

      - name: Tip kontrolü
        run: npm run typecheck


      - name: Bağımlılık güvenlik denetimi
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e '
            const report = require("/tmp/npm-audit.json");
            const entries = Object.entries(report.vulnerabilities ?? {});
            if (entries.length === 0) {
              console.log("npm audit: güvenlik açığı bulunmadı.");
            } else {
              for (const [name, item] of entries) {
                const via = (item.via ?? []).map((entry) => typeof entry === "string" ? entry : entry.title).join("; ");
                console.log(name + " | " + item.severity + " | direct=" + item.isDirect + " | fix=" + JSON.stringify(item.fixAvailable) + " | " + via);
              }
            }
            if (entries.length > 0) process.exit(1);
          '

      - name: Üretim derlemesi
        run: npm run build
        env:
          DATABASE_URL: postgresql://x:x@localhost:5432/x
          DIRECT_URL: postgresql://x:x@localhost:5432/x
