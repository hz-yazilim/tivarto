name: Build Tivarto Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-apk-conversion
    paths:
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"
      - "android/**"
      - "src/components/**"
      - "src/app/layout.tsx"
      - "www/**"

permissions:
  contents: read

jobs:
  build-android:
    name: Build debug APK and Android Studio project
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Package Android Studio project
        run: zip -qr tivarto-android-studio-project.zip android capacitor.config.ts package.json package-lock.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tivarto-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android Studio project
        uses: actions/upload-artifact@v4
        with:
          name: tivarto-android-studio-project
          path: tivarto-android-studio-project.zip
          if-no-files-found: error
          retention-days: 14
