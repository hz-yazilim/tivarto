<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0912">
    <title>Tivarto</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0b0912; color: #fff; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; box-sizing: border-box; }
      main { max-width: 360px; text-align: center; }
      .logo { width: 56px; height: 56px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 16px; background: linear-gradient(135deg,#7c3aed,#db2777); font-size: 28px; font-weight: 800; }
      p { color: #b8b4c4; line-height: 1.6; }
      button { margin-top: 14px; padding: 12px 20px; border: 0; border-radius: 12px; background: #8b5cf6; color: white; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">T</div>
      <h1>Tivarto bağlantısı kurulamadı</h1>
      <p>Uygulamanın çalışması için internet bağlantısı gerekir. Bağlantınızı kontrol edip yeniden deneyin.</p>
      <button onclick="location.reload()">Yeniden dene</button>
    </main>
  </body>
</html>
